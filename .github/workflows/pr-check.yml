name: PR quality check

# pull_request_target can comment on PRs from forks. To stay safe, the checker comes from the
# base branch and the PR files are only read as data (never executed or installed).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the checker from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Get the pull request files
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the checker
        run: python -m unittest discover -s base/test-scripts -v

      - name: List changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename' > changed.txt
          cat changed.txt

      - name: Check data quality and structure
        id: check
        continue-on-error: true
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GUIDE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.base.ref }}/contributions/CONTRIBUTING.md
        run: |
          python base/test-scripts/check_pr.py --root pr --changed-files changed.txt \
            --report report.md --author "$PR_AUTHOR" --guide-url "$GUIDE_URL"

      - name: Reply on the pull request
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tradchem-pr-check -->';
            const failed = process.env.OUTCOME !== 'success';
            const body = fs.existsSync('report.md')
              ? fs.readFileSync('report.md', 'utf8')
              : `${marker}\n## TradChem PR check could not run\n\nA maintainer will look at the workflow logs.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const previous = comments.filter(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            if (failed) {
              // A new comment notifies the author; older check comments are removed to keep the PR tidy.
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              for (const c of previous) await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
            } else if (previous.length) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.at(-1).id, body });
            }

      - name: Add the report to the job summary
        if: always()
        run: if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Mark the check as failed
        if: steps.check.outcome != 'success'
        run: exit 1
